[default]
extend-ignore-re = [
  # Ignore "analyzer"
  "rust-analyzer",
  # Ignore "color"
  "anstyle::Color",
  # Ignore "color": dix's flag
  "\"--color\"",
  # Ignore the rest of a word after the key that chooses it, as in "[r]etry"
  "\\[[a-z]\\][a-z]+",
]
extend-ignore-identifiers-re = [
  # Ignore "color"
  "Ansi256Color",
  "AnsiColor",
  "bg_color",
]
locale = "en-gb"
