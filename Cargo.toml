[package]
name = "rbld"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6.4", features = ["derive", "string"] }
git2 = "0.21.0"
hostname = "0.4.2"
pty-process = "0.5"
rustix = { version = "1.1.4", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
terminal_size = "0.4"
termtree = "1.0.0"
toml = "1.1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
unwrap_used = "deny"
try_err = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
